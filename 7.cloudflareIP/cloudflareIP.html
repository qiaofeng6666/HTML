<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网站检测工具 - 可访问性 & Cloudflare 检测</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 0%, #0f0c29, #1a1a3e 50%, #24243e);
            padding: 20px;
        }

        /* ===== 主卡片 ===== */
        .container {
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: 36px;
            padding: 40px 44px 44px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 34px;
        }

        .header .logo {
            font-size: 46px;
            display: block;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #f0f0ff 0%, #b8b8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            margin-top: 4px;
            letter-spacing: 0.2px;
        }

        /* ===== 输入区域 ===== */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .input-group .url-input-wrap {
            flex: 1;
            position: relative;
            min-width: 200px;
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 16px 18px;   /* 去掉左侧额外 padding，无前缀 */
            font-size: 16px;
            font-family: inherit;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            color: #f0f0ff;
            outline: none;
            transition: all 0.3s ease;
            font-weight: 450;
            letter-spacing: 0.2px;
        }

        .input-group input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
        }

        .input-group input[type="text"]:focus {
            border-color: rgba(130, 130, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(130, 130, 255, 0.12);
        }

        .input-group input[type="text"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-group .btn-check {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6c6cff, #4a4aff);
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            box-shadow: 0 6px 24px rgba(74, 74, 255, 0.25);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
            font-family: inherit;
        }

        .input-group .btn-check:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(74, 74, 255, 0.35);
            background: linear-gradient(135deg, #7a7aff, #5555ff);
        }

        .input-group .btn-check:active:not(:disabled) {
            transform: translateY(0px);
            box-shadow: 0 4px 16px rgba(74, 74, 255, 0.2);
        }

        .input-group .btn-check:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .input-group .btn-check .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 快捷示例 ===== */
        .examples {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 26px;
            justify-content: center;
        }

        .examples .chip {
            padding: 6px 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            font-weight: 450;
            font-family: inherit;
        }

        .examples .chip:hover {
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* ===== 结果区域 ===== */
        .result {
            margin-top: 8px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0;
            overflow: hidden;
            transition: all 0.4s ease;
            min-height: 0;
            max-height: 0;
            opacity: 0;
            transform: translateY(8px);
        }

        .result.visible {
            padding: 28px 30px 30px;
            min-height: 120px;
            max-height: 2000px;
            opacity: 1;
            transform: translateY(0);
            border-color: rgba(255, 255, 255, 0.06);
        }

        /* ===== 结果头部状态 ===== */
        .result .status-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .result .status-icon {
            font-size: 32px;
            line-height: 1;
            flex-shrink: 0;
        }

        .result .status-text {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.2px;
        }

        .result .status-text .sub {
            font-weight: 400;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 8px;
        }

        .result .status-badge {
            margin-left: auto;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
            font-family: inherit;
        }

        .result .status-badge.cloudflare {
            background: rgba(255, 130, 50, 0.12);
            border-color: rgba(255, 130, 50, 0.2);
            color: #fca96e;
        }

        .result .status-badge.no-cloudflare {
            background: rgba(100, 200, 255, 0.06);
            border-color: rgba(100, 200, 255, 0.08);
            color: rgba(255, 255, 255, 0.3);
        }

        /* ===== 统计网格 ===== */
        .result .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 16px 0 18px;
        }

        .result .stats .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .result .stats .stat-item .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
        }

        .result .stats .stat-item .value {
            font-size: 18px;
            font-weight: 600;
            color: #f0f0ff;
            margin-top: 2px;
            word-break: break-all;
        }

        .result .stats .stat-item .value .code-ok {
            color: #5ddf9a;
        }
        .result .stats .stat-item .value .code-err {
            color: #ff6b6b;
        }
        .result .stats .stat-item .value .code-warn {
            color: #ffd93d;
        }

        /* ===== Cloudflare 详情 ===== */
        .result .cf-details {
            margin: 12px 0 16px;
            padding: 14px 18px;
            border-radius: 14px;
            background: rgba(255, 130, 50, 0.04);
            border-left: 3px solid rgba(255, 130, 50, 0.25);
            display: none;
        }

        .result .cf-details.visible {
            display: block;
        }

        .result .cf-details .cf-title {
            font-size: 14px;
            font-weight: 600;
            color: #fca96e;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .result .cf-details .cf-item {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            padding: 2px 0;
            font-family: "SF Mono", "Fira Code", monospace;
            word-break: break-all;
        }

        .result .cf-details .cf-item strong {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            margin-right: 6px;
        }

        /* ===== 响应头列表 ===== */
        .result .headers-section {
            margin-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 16px;
        }

        .result .headers-section .toggle-headers {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
            font-weight: 500;
            font-family: inherit;
        }

        .result .headers-section .toggle-headers:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .result .headers-section .headers-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.25s ease;
            opacity: 0;
        }

        .result .headers-section .headers-list.open {
            max-height: 1200px;
            opacity: 1;
            margin-top: 12px;
        }

        .result .headers-section .headers-list .header-row {
            display: flex;
            padding: 5px 0;
            font-size: 13px;
            font-family: "SF Mono", "Fira Code", monospace;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            gap: 12px;
        }

        .result .headers-section .headers-list .header-row .hkey {
            color: rgba(255, 255, 255, 0.35);
            min-width: 120px;
            flex-shrink: 0;
            font-weight: 500;
        }

        .result .headers-section .headers-list .header-row .hval {
            color: rgba(255, 255, 255, 0.7);
            word-break: break-all;
        }

        .result .headers-section .headers-list .header-row.cf-highlight {
            background: rgba(255, 130, 50, 0.04);
            border-radius: 4px;
            padding: 5px 8px;
            margin: 1px 0;
            border-bottom-color: rgba(255, 130, 50, 0.06);
        }

        .result .headers-section .headers-list .header-row.cf-highlight .hkey {
            color: #fca96e;
        }
        .result .headers-section .headers-list .header-row.cf-highlight .hval {
            color: #f0d0b0;
        }

        /* ===== 错误信息 ===== */
        .result .error-msg {
            margin-top: 14px;
            padding: 14px 18px;
            background: rgba(255, 70, 70, 0.06);
            border-radius: 14px;
            border-left: 3px solid rgba(255, 70, 70, 0.3);
            color: #ff8a8a;
            font-size: 14px;
            display: none;
        }

        .result .error-msg.visible {
            display: block;
        }

        /* ===== 空状态 ===== */
        .result .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            padding: 20px 0 8px;
            font-size: 14px;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 0.5px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.15);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: rgba(255, 255, 255, 0.3);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container {
                padding: 24px 18px 28px;
                border-radius: 24px;
            }

            .header h1 {
                font-size: 22px;
            }
            .header .logo {
                font-size: 36px;
            }

            .input-group {
                flex-direction: column;
                gap: 10px;
            }
            .input-group input[type="text"] {
                padding: 14px 16px;
                font-size: 15px;
            }
            .input-group .btn-check {
                padding: 14px 20px;
                font-size: 15px;
                min-width: 100%;
            }

            .result.visible {
                padding: 20px 18px 22px;
            }
            .result .status-row {
                gap: 10px;
            }
            .result .status-icon {
                font-size: 26px;
            }
            .result .status-text {
                font-size: 17px;
            }
            .result .status-text .sub {
                font-size: 13px;
                margin-left: 4px;
                display: block;
                margin-top: 2px;
            }
            .result .status-badge {
                font-size: 12px;
                padding: 3px 12px;
                margin-left: 0;
            }
            .result .stats {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .result .stats .stat-item .value {
                font-size: 16px;
            }
            .result .headers-section .headers-list .header-row {
                font-size: 12px;
                flex-wrap: wrap;
                gap: 4px;
            }
            .result .headers-section .headers-list .header-row .hkey {
                min-width: 80px;
            }

            .examples .chip {
                font-size: 12px;
                padding: 4px 12px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 16px 12px 20px;
            }
            .result .stats {
                grid-template-columns: 1fr;
            }
            .result .stats .stat-item {
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== 头部 ===== -->
        <div class="header">
            <span class="logo">🔍</span>
            <h1>网站检测工具</h1>
            <p>输入网址，检测可访问性 &amp; 是否使用 Cloudflare 服务</p>
        </div>

        <!-- ===== 输入 ===== -->
        <div class="input-group">
            <div class="url-input-wrap">
                <input
                type="text"
                id="urlInput"
                placeholder="输入网址，例如 example.com 或 github.com"
                autofocus
                spellcheck="false"
                />
            </div>
            <button class="btn-check" id="checkBtn">
                <span class="btn-text">检测</span>
            </button>
        </div>

        <!-- ===== 快捷示例 ===== -->
        <div class="examples">
            <span class="chip" data-url="cloudflare.com">☁️ cloudflare.com</span>
            <span class="chip" data-url="github.com">🐙 github.com</span>
            <span class="chip" data-url="baidu.com">🔎 baidu.com</span>
            <span class="chip" data-url="example.com">📄 example.com</span>
            <span class="chip" data-url="nonexistent.xyz">❌ 失效示例</span>
        </div>

        <!-- ===== 结果区域 ===== -->
        <div class="result" id="result">

            <!-- 状态行 -->
            <div class="status-row">
                <span class="status-icon" id="statusIcon">⏳</span>
                <span class="status-text" id="statusText">
                    等待检测
                    <span class="sub" id="statusSub"></span>
                </span>
                <span class="status-badge" id="cfBadge">—</span>
            </div>

            <!-- 统计 -->
            <div class="stats" id="stats">
                <div class="stat-item">
                    <div class="label">状态码</div>
                    <div class="value" id="statCode">—</div>
                </div>
                <div class="stat-item">
                    <div class="label">响应时间</div>
                    <div class="value" id="statTime">—</div>
                </div>
                <div class="stat-item">
                    <div class="label">服务器</div>
                    <div class="value" id="statServer">—</div>
                </div>
                <div class="stat-item">
                    <div class="label">内容类型</div>
                    <div class="value" id="statType">—</div>
                </div>
            </div>

            <!-- Cloudflare 详情 -->
            <div class="cf-details" id="cfDetails">
                <div class="cf-title">☁️ Cloudflare 检测到</div>
                <div class="cf-item" id="cfRay"><strong>Ray ID</strong> —</div>
                <div class="cf-item" id="cfServer"><strong>Server</strong> —</div>
                <div class="cf-item" id="cfCache"><strong>Cache</strong> —</div>
                <div class="cf-item" id="cfExtra" style="margin-top:4px; font-size:13px; color:rgba(255,255,255,0.4);"></div>
            </div>

            <!-- 错误信息 -->
            <div class="error-msg" id="errorMsg"></div>

            <!-- 响应头 -->
            <div class="headers-section">
                <button class="toggle-headers" id="toggleHeaders">
                    <span>▶</span> 查看响应头
                </button>
                <div class="headers-list" id="headersList">
                    <!-- 动态渲染 -->
                </div>
            </div>

            <!-- 空状态（初始） -->
            <div class="empty-state" id="emptyState">输入网址后点击「检测」开始</div>
        </div>

        <!-- ===== 底部 ===== -->
        <div class="footer">
            使用 <a href="https://api.allorigins.win/" target="_blank" rel="noopener">allorigins</a> 代理检测 &bull; 数据仅用于本地展示
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---- DOM 引用 ----
            const urlInput = document.getElementById('urlInput');
            const checkBtn = document.getElementById('checkBtn');
            const resultEl = document.getElementById('result');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const statusSub = document.getElementById('statusSub');
            const cfBadge = document.getElementById('cfBadge');
            const statCode = document.getElementById('statCode');
            const statTime = document.getElementById('statTime');
            const statServer = document.getElementById('statServer');
            const statType = document.getElementById('statType');
            const cfDetails = document.getElementById('cfDetails');
            const cfRay = document.getElementById('cfRay');
            const cfServer = document.getElementById('cfServer');
            const cfCache = document.getElementById('cfCache');
            const cfExtra = document.getElementById('cfExtra');
            const errorMsg = document.getElementById('errorMsg');
            const emptyState = document.getElementById('emptyState');
            const headersList = document.getElementById('headersList');
            const toggleHeadersBtn = document.getElementById('toggleHeaders');

            // ---- 状态 ----
            let isChecking = false;
            let headersOpen = false;

            // ---- 工具 ----
            function normalizeUrl(raw) {
                let s = raw.trim();
                if (!s) return null;
                // 如果已经包含协议，直接返回
                if (/^https?:\/\//i.test(s)) {
                    return s;
                }
                // 否则默认加 https://
                return 'https://' + s;
            }

            function isValidUrl(url) {
                try {
                    const u = new URL(url);
                    return u.protocol === 'http:' || u.protocol === 'https:';
                } catch (_) {
                    return false;
                }
            }

            function formatTime(ms) {
                if (ms < 1) return '< 1ms';
                if (ms < 1000) return Math.round(ms) + 'ms';
                return (ms / 1000).toFixed(2) + 's';
            }

            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ---- 检测 Cloudflare ----
            function detectCloudflare(headers) {
                const h = headers || {};
                // 转小写比较
                const keys = Object.keys(h);
                const lowerKeys = keys.map(k => k.toLowerCase());

                // 1. server 头包含 cloudflare
                if (h.server && h.server.toLowerCase().includes('cloudflare')) {
                    return true;
                }
                // 2. cf-ray 头存在
                if (h['cf-ray']) {
                    return true;
                }
                // 3. 任何 CF-* 头
                for (const k of keys) {
                    if (k.toLowerCase().startsWith('cf-')) {
                        return true;
                    }
                }
                // 4. x-cache 包含 cf
                if (h['x-cache'] && h['x-cache'].toLowerCase().includes('cf')) {
                    return true;
                }
                // 5. 其他常见 Cloudflare 头
                const cfHeaders = ['cf-cache-status', 'cf-ray', 'cf-request-id', 'cf-visitor', 'cf-worker'];
                for (const ch of cfHeaders) {
                    if (h[ch]) return true;
                }
                return false;
            }

            // ---- 提取 Cloudflare 详情 ----
            function extractCfDetails(headers) {
                const h = headers || {};
                const details = {
                    ray: h['cf-ray'] || h['Cf-Ray'] || null,
                    server: h.server || null,
                    cache: h['cf-cache-status'] || h['Cf-Cache-Status'] || null,
                    extra: []
                };
                // 收集其他 CF 头
                for (const [key, val] of Object.entries(h)) {
                    const lower = key.toLowerCase();
                    if (lower.startsWith('cf-') && lower !== 'cf-ray' && lower !== 'cf-cache-status') {
                        details.extra.push({ key, val });
                    }
                }
                return details;
            }

            // ---- 渲染响应头 ----
            function renderHeaders(headers, cfDetected) {
                const h = headers || {};
                const keys = Object.keys(h);
                if (keys.length === 0) {
                    headersList.innerHTML =
                        '<div style="color:rgba(255,255,255,0.2); font-size:13px; padding:8px 0;">无响应头数据</div>';
                    return;
                }

                let html = '';
                // 按字母排序
                const sorted = keys.sort((a, b) => a.localeCompare(b));
                const cfKeys = new Set();
                if (cfDetected) {
                    for (const k of sorted) {
                        if (k.toLowerCase().startsWith('cf-') ||
                            k.toLowerCase() === 'server' ||
                            k.toLowerCase() === 'x-cache') {
                            cfKeys.add(k);
                        }
                    }
                }

                for (const key of sorted) {
                    const val = h[key];
                    const isCf = cfKeys.has(key);
                    const cls = isCf ? 'header-row cf-highlight' : 'header-row';
                    html += `<div class="${cls}">
                                <span class="hkey">${escapeHtml(key)}</span>
                                <span class="hval">${escapeHtml(String(val))}</span>
                            </div>`;
                }
                headersList.innerHTML = html;
            }

            // ---- 主检测函数 ----
            async function performCheck(rawUrl) {
                if (isChecking) return;

                // 重置 UI
                isChecking = true;
                checkBtn.disabled = true;
                checkBtn.querySelector('.btn-text').textContent = '检测中…';
                const spinner = document.createElement('span');
                spinner.className = 'spinner';
                checkBtn.prepend(spinner);

                // 隐藏旧结果
                resultEl.classList.remove('visible');
                errorMsg.classList.remove('visible');
                cfDetails.classList.remove('visible');
                headersList.classList.remove('open');
                headersOpen = false;
                toggleHeadersBtn.innerHTML = '<span>▶</span> 查看响应头';

                // 清空
                statusIcon.textContent = '⏳';
                statusText.textContent = '检测中...';
                statusSub.textContent = '';
                cfBadge.textContent = '⏳';
                cfBadge.className = 'status-badge';
                statCode.textContent = '…';
                statTime.textContent = '…';
                statServer.textContent = '…';
                statType.textContent = '…';
                emptyState.style.display = 'none';

                // 规范化 URL
                let targetUrl = normalizeUrl(rawUrl);
                if (!targetUrl) {
                    showError('请输入有效的网址');
                    finishCheck();
                    return;
                }
                if (!isValidUrl(targetUrl)) {
                    showError('网址格式不正确，请检查后重试');
                    finishCheck();
                    return;
                }

                // 更新输入框显示完整 URL（方便用户看到最终访问地址）
                urlInput.value = targetUrl;

                // 开始计时
                const startTime = performance.now();

                // 构建代理 URL
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

                // 请求超时控制 —— 缩短至 10 秒，避免用户等待过久
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                try {
                    const response = await fetch(proxyUrl, {
                        signal: controller.signal,
                        headers: {
                            'Accept': 'application/json'
                        }
                    });

                    clearTimeout(timeoutId);
                    const endTime = performance.now();
                    const elapsed = endTime - startTime;

                    if (!response.ok) {
                        throw new Error(`代理服务请求失败 (HTTP ${response.status})`);
                    }

                    const data = await response.json();

                    // 检查 allorigins 返回的数据结构
                    if (!data || typeof data !== 'object') {
                        throw new Error('代理服务返回了无效数据');
                    }

                    // 目标网站状态码
                    const httpCode = data.status?.http_code ?? 0;
                    const statusTextVal = data.status?.http_status || '';
                    const contentType = data.status?.content_type || '';
                    const contentLength = data.status?.content_length || '';

                    // 响应头
                    const headers = data.headers || {};

                    // 判断可访问性 (2xx, 3xx 视为可访问)
                    const isAccessible = httpCode >= 200 && httpCode < 400;

                    // 检测 Cloudflare
                    const isCf = detectCloudflare(headers);
                    const cfDetailsData = extractCfDetails(headers);

                    // ---- 渲染结果 ----
                    resultEl.classList.add('visible');

                    // 状态图标
                    if (isAccessible) {
                        statusIcon.textContent = '✅';
                    } else if (httpCode >= 400 && httpCode < 500) {
                        statusIcon.textContent = '⚠️';
                    } else if (httpCode >= 500 || httpCode === 0) {
                        statusIcon.textContent = '❌';
                    } else {
                        statusIcon.textContent = '❓';
                    }

                    // 状态文字
                    let statusMain = isAccessible ? '网站可访问' : '网站不可访问';
                    if (httpCode === 0) {
                        statusMain = '无法连接';
                    }
                    statusText.textContent = statusMain;
                    statusSub.textContent = httpCode > 0 ? `${httpCode} ${statusTextVal}` : '';

                    // Cloudflare 徽章
                    if (isCf) {
                        cfBadge.textContent = '☁️ Cloudflare';
                        cfBadge.className = 'status-badge cloudflare';
                    } else {
                        cfBadge.textContent = '✖ 未使用 Cloudflare';
                        cfBadge.className = 'status-badge no-cloudflare';
                    }

                    // 统计信息
                    statCode.innerHTML = httpCode > 0 ?
                        `<span class="${isAccessible ? 'code-ok' : httpCode >= 400 && httpCode < 500 ? 'code-warn' : 'code-err'}">${httpCode}</span>` :
                        '<span style="color:rgba(255,255,255,0.3);">—</span>';

                    statTime.textContent = formatTime(elapsed);
                    statServer.textContent = headers.server || '—';
                    statType.textContent = contentType || '—';

                    // Cloudflare 详情
                    if (isCf) {
                        cfDetails.classList.add('visible');
                        cfRay.innerHTML = `<strong>Ray ID</strong> ${cfDetailsData.ray || '—'}`;
                        cfServer.innerHTML = `<strong>Server</strong> ${cfDetailsData.server || '—'}`;
                        cfCache.innerHTML = `<strong>Cache 状态</strong> ${cfDetailsData.cache || '—'}`;
                        if (cfDetailsData.extra.length > 0) {
                            const extraStr = cfDetailsData.extra
                                .map(e => `${e.key}: ${e.val}`)
                                .join(' &bull; ');
                            cfExtra.textContent = '其他 CF 头: ' + extraStr;
                            cfExtra.style.display = 'block';
                        } else {
                            cfExtra.style.display = 'none';
                        }
                    } else {
                        cfDetails.classList.remove('visible');
                    }

                    // 渲染响应头
                    renderHeaders(headers, isCf);

                    // 清除错误
                    errorMsg.classList.remove('visible');

                    // 如果不可访问，显示额外提示
                    if (!isAccessible && httpCode > 0) {
                        showError(`目标网站返回 ${httpCode} ${statusTextVal}，请检查网址是否正确。`);
                    } else if (httpCode === 0) {
                        showError('无法连接到目标网站，可能域名不存在、服务器无响应或网络问题。');
                    } else {
                        errorMsg.classList.remove('visible');
                    }

                } catch (err) {
                    clearTimeout(timeoutId);
                    const endTime = performance.now();
                    const elapsed = endTime - startTime;

                    // 显示错误
                    let errMsg = err.message || '未知错误';
                    if (err.name === 'AbortError') {
                        errMsg = '请求超时（10秒），请检查网络或稍后重试。';
                    } else if (errMsg.includes('Failed to fetch')) {
                        errMsg = '无法连接到检测服务，请检查网络连接。';
                    }

                    // 仍然显示结果区域，但标记为错误
                    resultEl.classList.add('visible');
                    statusIcon.textContent = '❌';
                    statusText.textContent = '检测失败';
                    statusSub.textContent = '';
                    cfBadge.textContent = '✖ 错误';
                    cfBadge.className = 'status-badge no-cloudflare';
                    statCode.textContent = '—';
                    statTime.textContent = formatTime(elapsed);
                    statServer.textContent = '—';
                    statType.textContent = '—';
                    cfDetails.classList.remove('visible');
                    renderHeaders({}, false);
                    showError(errMsg);

                } finally {
                    clearTimeout(timeoutId);
                    finishCheck();
                }
            }

            // ---- 辅助：显示错误 ----
            function showError(msg) {
                errorMsg.textContent = '⚠ ' + msg;
                errorMsg.classList.add('visible');
            }

            // ---- 辅助：完成检测 ----
            function finishCheck() {
                isChecking = false;
                checkBtn.disabled = false;
                checkBtn.querySelector('.btn-text').textContent = '检测';
                const spinner = checkBtn.querySelector('.spinner');
                if (spinner) spinner.remove();
                // 如果结果可见且没有错误，隐藏空状态
                if (resultEl.classList.contains('visible')) {
                    emptyState.style.display = 'none';
                }
            }

            // ---- 事件绑定 ----

            // 检测按钮
            checkBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const val = urlInput.value.trim();
                if (!val) {
                    urlInput.focus();
                    urlInput.style.borderColor = 'rgba(255,100,100,0.5)';
                    setTimeout(() => { urlInput.style.borderColor = ''; }, 1200);
                    return;
                }
                performCheck(val);
            });

            // 回车键
            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    checkBtn.click();
                }
            });

            // 快捷示例
            document.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    const url = this.dataset.url;
                    if (url) {
                        urlInput.value = url;
                        performCheck(url);
                    }
                });
            });

            // 切换响应头
            toggleHeadersBtn.addEventListener('click', function() {
                headersOpen = !headersOpen;
                if (headersOpen) {
                    headersList.classList.add('open');
                    toggleHeadersBtn.innerHTML = '<span>▼</span> 收起响应头';
                } else {
                    headersList.classList.remove('open');
                    toggleHeadersBtn.innerHTML = '<span>▶</span> 查看响应头';
                }
            });

            // 输入框自动聚焦
            if (urlInput) {
                setTimeout(() => urlInput.focus(), 400);
            }

            // ---- 初始化 ----
            // 默认展示空状态
            resultEl.classList.remove('visible');
            emptyState.style.display = 'block';

            console.log('🔍 网站检测工具已加载');
            console.log('ℹ️ 使用 allorigins 代理检测，支持 CORS');

        })();
    </script>

</body>
</html>
