<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IP 代理列表 · 去重排序</title>
    <style>
        /* ========== 全局重置 & 基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f4f6fa;
            color: #1e293b;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 32px 36px 40px;
            transition: box-shadow 0.2s;
        }

        /* ========== 头部 ========== */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            border-bottom: 2px solid #f1f4f9;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 span {
            background: #eef2ff;
            color: #4a6cf7;
            font-size: 14px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            margin-left: 4px;
        }

        .header .subtitle {
            color: #64748b;
            font-size: 14px;
            font-weight: 400;
            margin-top: 2px;
        }

        /* ========== 输入区 ========== */
        .input-section {
            margin-bottom: 24px;
        }

        .input-section .label-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .input-section .label-row label {
            font-weight: 600;
            font-size: 15px;
            color: #0f172a;
        }

        .input-section .label-row .hint {
            font-size: 13px;
            color: #94a3b8;
            background: #f8fafc;
            padding: 2px 14px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 16px 18px;
            font-size: 14px;
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: #fafcff;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
            line-height: 1.7;
            color: #0f172a;
        }

        textarea:focus {
            outline: none;
            border-color: #4a6cf7;
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.12);
            background: #ffffff;
        }

        textarea::placeholder {
            color: #b9c7da;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
        }

        /* ========== 按钮组 ========== */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #f1f4f9;
            color: #1e293b;
            letter-spacing: 0.2px;
            user-select: none;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        }
        .btn:active {
            transform: translateY(0px);
        }

        .btn-primary {
            background: #4a6cf7;
            color: #fff;
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.30);
        }
        .btn-primary:hover {
            background: #3b5de7;
            box-shadow: 0 6px 20px rgba(74, 108, 247, 0.35);
        }

        .btn-success {
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .btn-success:hover {
            background: #059669;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.30);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #e2e8f0;
        }
        .btn-outline:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .btn-danger-outline {
            background: transparent;
            border: 2px solid #fee2e2;
            color: #dc2626;
        }
        .btn-danger-outline:hover {
            background: #fef2f2;
            border-color: #fca5a5;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ========== 统计信息 ========== */
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 36px;
            background: #f8fafc;
            border-radius: 14px;
            padding: 16px 24px;
            margin: 20px 0 18px;
            border: 1px solid #eef2f6;
        }

        .stats .stat-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 14px;
            color: #475569;
        }

        .stats .stat-item .num {
            font-weight: 700;
            font-size: 18px;
            color: #0f172a;
            min-width: 28px;
        }

        .stats .stat-item .num.highlight {
            color: #4a6cf7;
        }
        .stats .stat-item .num.warning {
            color: #dc2626;
        }
        .stats .stat-item .num.success {
            color: #10b981;
        }

        .stats .stat-divider {
            width: 1px;
            background: #e2e8f0;
            flex-shrink: 0;
        }

        /* ========== 结果区 ========== */
        .result-section {
            margin-top: 6px;
        }

        .result-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .result-header h2 {
            font-size: 17px;
            font-weight: 600;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-header h2 .badge {
            background: #eef2ff;
            color: #4a6cf7;
            font-size: 13px;
            font-weight: 600;
            padding: 0 12px;
            border-radius: 16px;
            line-height: 24px;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .result-actions .btn {
            padding: 6px 18px;
            font-size: 13px;
        }

        /* ========== 表格 ========== */
        .table-wrap {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid #eef2f6;
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 580px;
        }

        table thead {
            background: #f8fafc;
            border-bottom: 2px solid #eef2f6;
        }

        table thead th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #64748b;
            white-space: nowrap;
        }

        table tbody tr {
            border-bottom: 1px solid #f1f4f9;
            transition: background 0.15s;
        }

        table tbody tr:hover {
            background: #fafcff;
        }

        table tbody tr:last-child {
            border-bottom: none;
        }

        table tbody td {
            padding: 12px 16px;
            vertical-align: middle;
            line-height: 1.5;
            color: #1e293b;
        }

        table tbody td .mono {
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
            font-size: 13px;
        }

        table tbody td .ip-cell {
            font-weight: 500;
            color: #0f172a;
        }

        table tbody td .port-cell {
            font-weight: 600;
            color: #4a6cf7;
            background: #eef2ff;
            padding: 0 10px;
            border-radius: 8px;
            display: inline-block;
            font-size: 13px;
            line-height: 26px;
        }

        table tbody td .extra-cell {
            color: #64748b;
            font-size: 13px;
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
        }

        table tbody td .full-cell {
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
            font-size: 13px;
            color: #1e293b;
            word-break: break-all;
            max-width: 300px;
        }

        .col-seq {
            width: 50px;
            text-align: center;
            color: #94a3b8;
            font-weight: 500;
            font-size: 13px;
        }
        .col-ip {
            min-width: 140px;
        }
        .col-port {
            min-width: 70px;
        }
        .col-extra {
            min-width: 140px;
        }
        .col-full {
            min-width: 220px;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            padding: 48px 20px;
            text-align: center;
            color: #94a3b8;
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }
        .empty-state p {
            font-size: 15px;
        }

        /* ========== Toast 提示 ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #0f172a;
            color: #fff;
            padding: 12px 28px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0px);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .app {
                padding: 20px 16px 28px;
                border-radius: 16px;
            }

            .header h1 {
                font-size: 20px;
            }
            .header .subtitle {
                font-size: 13px;
                width: 100%;
                margin-top: 2px;
            }

            textarea {
                height: 160px;
                font-size: 13px;
                padding: 12px 14px;
            }

            .button-group .btn {
                flex: 1 1 auto;
                padding: 8px 16px;
                font-size: 13px;
            }

            .stats {
                padding: 14px 18px;
                gap: 12px 24px;
            }
            .stats .stat-item {
                font-size: 13px;
            }
            .stats .stat-item .num {
                font-size: 16px;
            }

            .result-header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .result-header h2 {
                font-size: 15px;
            }
            .result-actions .btn {
                padding: 5px 14px;
                font-size: 12px;
            }

            table {
                font-size: 13px;
                min-width: 480px;
            }
            table thead th,
            table tbody td {
                padding: 10px 12px;
            }
            .col-full {
                min-width: 160px;
            }

            .toast {
                font-size: 13px;
                padding: 10px 20px;
                bottom: 20px;
                max-width: 90%;
            }
        }

        @media (max-width: 480px) {
            .app {
                padding: 14px 10px 20px;
            }
            .header h1 {
                font-size: 18px;
            }
            .header h1 span {
                font-size: 11px;
                padding: 1px 10px;
            }
            textarea {
                height: 130px;
                font-size: 12px;
                padding: 10px 12px;
            }
            .button-group {
                gap: 8px;
            }
            .button-group .btn {
                font-size: 12px;
                padding: 6px 12px;
            }
            .stats {
                flex-direction: column;
                gap: 6px;
                padding: 12px 16px;
            }
            .stats .stat-divider {
                display: none;
            }
            table {
                font-size: 12px;
                min-width: 380px;
            }
            table thead th,
            table tbody td {
                padding: 8px 10px;
            }
            .col-seq {
                width: 34px;
            }
            .col-ip {
                min-width: 100px;
            }
            .col-extra {
                min-width: 80px;
            }
            .col-full {
                min-width: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- 头部 -->
        <header class="header">
            <div>
                <h1>
                    🧹 代理去重排序
                    <span>IP + 端口</span>
                </h1>
                <div class="subtitle">粘贴代理列表，按 IP 排序，自动去重（IP:端口 相同则保留一个）</div>
            </div>
        </header>

        <!-- 输入区 -->
        <section class="input-section">
            <div class="label-row">
                <label for="inputArea">📥 输入代理列表</label>
                <span class="hint">每行一个 &nbsp; IP:端口#其他信息</span>
            </div>
            <textarea id="inputArea" placeholder="例如：&#10;123.45.678.3:2087#ADC-13ms-500MB/s&#10;123.45.678.5:2083#ASD-39ms-989MB/s&#10;123.45.678.3:2087#QWE-14ms-480MB/s"></textarea>

            <div class="button-group">
                <button class="btn btn-primary" id="btnProcess">🚀 去重排序</button>
                <button class="btn btn-success" id="btnExample">📋 填入示例</button>
                <button class="btn btn-outline" id="btnClear">🗑️ 清空</button>
            </div>
        </section>

        <!-- 统计 -->
        <div class="stats" id="statsArea" style="display:none;">
            <div class="stat-item">
                原始条目 <span class="num" id="statRaw">0</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                有效解析 <span class="num" id="statValid">0</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                去重后 <span class="num highlight" id="statUnique">0</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                无效行 <span class="num warning" id="statInvalid">0</span>
            </div>
        </div>

        <!-- 结果区 -->
        <section class="result-section">
            <div class="result-header">
                <h2>
                    📊 排序结果
                    <span class="badge" id="resultBadge">0 条</span>
                </h2>
                <div class="result-actions">
                    <button class="btn btn-outline" id="btnCopy">📄 复制结果</button>
                </div>
            </div>

            <div class="table-wrap" id="tableWrap">
                <div class="empty-state" id="emptyState">
                    <span class="icon">📭</span>
                    <p>暂无数据，请在上方输入代理列表后点击「去重排序」</p>
                </div>
                <table id="resultTable" style="display:none;">
                    <thead>
                        <tr>
                            <th class="col-seq">#</th>
                            <th class="col-ip">IP 地址</th>
                            <th class="col-port">端口</th>
                            <th class="col-extra">其他信息</th>
                            <th class="col-full">完整条目</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  DOM 引用
            // ============================================================
            const inputArea = document.getElementById('inputArea');
            const btnProcess = document.getElementById('btnProcess');
            const btnExample = document.getElementById('btnExample');
            const btnClear = document.getElementById('btnClear');
            const btnCopy = document.getElementById('btnCopy');

            const statsArea = document.getElementById('statsArea');
            const statRaw = document.getElementById('statRaw');
            const statValid = document.getElementById('statValid');
            const statUnique = document.getElementById('statUnique');
            const statInvalid = document.getElementById('statInvalid');
            const resultBadge = document.getElementById('resultBadge');

            const tableWrap = document.getElementById('tableWrap');
            const emptyState = document.getElementById('emptyState');
            const resultTable = document.getElementById('resultTable');
            const tableBody = document.getElementById('tableBody');

            const toastEl = document.getElementById('toast');

            let toastTimer = null;

            // ============================================================
            //  示例数据
            // ============================================================
            const EXAMPLE_DATA = [
                '123.45.229.3:2087#QWE-43ms-500MB/s',
                '134.67.229.5:2083#ASD-39ms-989MB/s',
                '145.78.229.3:2087#ZXC-45ms-480MB/s',
                '156.89.229.7:2080#RFV-20ms-123MB/s',
            ];

            // ============================================================
            //  工具函数
            // ============================================================
            function showToast(msg, duration) {
                duration = duration || 2000;
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show');
                    toastTimer = null;
                }, duration);
            }

            // 解析单行：返回 { ip, port, extra, full } 或 null
            function parseLine(line) {
                const trimmed = line.trim();
                if (!trimmed) return null;

                // 寻找 # 分割
                const hashIdx = trimmed.indexOf('#');
                let before = trimmed;
                let extra = '';
                if (hashIdx !== -1) {
                    before = trimmed.substring(0, hashIdx);
                    extra = trimmed.substring(hashIdx + 1);
                }

                // 寻找 : 分割 IP 和 端口
                const colonIdx = before.indexOf(':');
                if (colonIdx === -1) return null;

                const ip = before.substring(0, colonIdx).trim();
                const portStr = before.substring(colonIdx + 1).trim();
                if (!ip || !portStr) return null;

                const port = parseInt(portStr, 10);
                if (isNaN(port) || port < 0 || port > 65535) return null;

                // 简单 IP 格式校验（不严谨但够用）
                const ipParts = ip.split('.');
                if (ipParts.length !== 4) return null;
                for (const p of ipParts) {
                    const num = parseInt(p, 10);
                    if (isNaN(num) || num < 0 || num > 255) return null;
                }

                return {
                    ip: ip,
                    port: port,
                    extra: extra,
                    full: trimmed
                };
            }

            // IP 比较函数（数字顺序）
            function compareIP(a, b) {
                const pa = a.ip.split('.').map(Number);
                const pb = b.ip.split('.').map(Number);
                for (let i = 0; i < 4; i++) {
                    if (pa[i] !== pb[i]) return pa[i] - pb[i];
                }
                // IP 相同，按端口排序
                return a.port - b.port;
            }

            // ============================================================
            //  核心处理
            // ============================================================
            function processInput(text) {
                const lines = text.split('\n');

                let rawCount = 0;
                let validItems = [];
                let invalidCount = 0;

                for (const line of lines) {
                    rawCount++;
                    const parsed = parseLine(line);
                    if (parsed) {
                        validItems.push(parsed);
                    } else {
                        // 空行不计入无效
                        if (line.trim() !== '') {
                            invalidCount++;
                        } else {
                            rawCount--; // 空行不算原始条目
                        }
                    }
                }

                // 去重：基于 ip:port
                const map = new Map();
                for (const item of validItems) {
                    const key = item.ip + ':' + item.port;
                    if (!map.has(key)) {
                        map.set(key, item);
                    }
                    // 如果已存在，保留第一个（不覆盖）
                }

                const uniqueItems = Array.from(map.values());
                // 排序
                uniqueItems.sort(compareIP);

                return {
                    rawCount: rawCount,
                    validCount: validItems.length,
                    uniqueCount: uniqueItems.length,
                    invalidCount: invalidCount,
                    items: uniqueItems,
                };
            }

            // ============================================================
            //  渲染结果
            // ============================================================
            function renderResult(result) {
                const { rawCount, validCount, uniqueCount, invalidCount, items } = result;

                // 更新统计
                statsArea.style.display = 'flex';
                statRaw.textContent = rawCount;
                statValid.textContent = validCount;
                statUnique.textContent = uniqueCount;
                statInvalid.textContent = invalidCount;
                resultBadge.textContent = uniqueCount + ' 条';

                // 表格
                if (items.length === 0) {
                    emptyState.style.display = 'block';
                    resultTable.style.display = 'none';
                    return;
                }

                emptyState.style.display = 'none';
                resultTable.style.display = 'table';

                // 清空并填充 tbody
                tableBody.innerHTML = '';
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    const tr = document.createElement('tr');

                    const seqTd = document.createElement('td');
                    seqTd.className = 'col-seq';
                    seqTd.textContent = i + 1;

                    const ipTd = document.createElement('td');
                    ipTd.className = 'col-ip';
                    ipTd.innerHTML = `<span class="mono ip-cell">${item.ip}</span>`;

                    const portTd = document.createElement('td');
                    portTd.className = 'col-port';
                    portTd.innerHTML = `<span class="port-cell">${item.port}</span>`;

                    const extraTd = document.createElement('td');
                    extraTd.className = 'col-extra';
                    extraTd.innerHTML = item.extra ? `<span class="extra-cell">${escapeHtml(item.extra)}</span>` : '<span style="color:#cbd5e1;">—</span>';

                    const fullTd = document.createElement('td');
                    fullTd.className = 'col-full';
                    fullTd.innerHTML = `<span class="full-cell">${escapeHtml(item.full)}</span>`;

                    tr.appendChild(seqTd);
                    tr.appendChild(ipTd);
                    tr.appendChild(portTd);
                    tr.appendChild(extraTd);
                    tr.appendChild(fullTd);
                    tableBody.appendChild(tr);
                }
            }

            // 简单防 XSS
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ============================================================
            //  复制结果
            // ============================================================
            function copyResult() {
                const rows = tableBody.querySelectorAll('tr');
                if (rows.length === 0) {
                    showToast('没有可复制的结果', 1500);
                    return;
                }
                const lines = [];
                for (const tr of rows) {
                    const fullCell = tr.querySelector('.col-full .full-cell');
                    if (fullCell) {
                        lines.push(fullCell.textContent);
                    }
                }
                if (lines.length === 0) {
                    showToast('没有可复制的内容', 1500);
                    return;
                }

                const text = lines.join('\n');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('✅ 已复制 ' + lines.length + ' 条结果', 1800);
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('✅ 已复制 ' + text.split('\n').length + ' 条结果', 1800);
                } catch (e) {
                    showToast('❌ 复制失败，请手动复制', 2000);
                }
                document.body.removeChild(ta);
            }

            // ============================================================
            //  事件绑定
            // ============================================================

            // 处理按钮
            btnProcess.addEventListener('click', function() {
                const text = inputArea.value;
                if (!text.trim()) {
                    showToast('⚠️ 请先输入代理列表', 1800);
                    return;
                }

                const result = processInput(text);
                renderResult(result);

                // 滚动到结果区
                const rect = statsArea.getBoundingClientRect();
                if (rect.top < 0 || rect.top > window.innerHeight * 0.6) {
                    document.querySelector('.result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
                }

                showToast('✅ 处理完成 · 去重后 ' + result.uniqueCount + ' 条', 1800);
            });

            // 填入示例
            btnExample.addEventListener('click', function() {
                inputArea.value = EXAMPLE_DATA.join('\n');
                showToast('📋 已填入示例数据', 1200);
                // 自动处理
                btnProcess.click();
            });

            // 清空
            btnClear.addEventListener('click', function() {
                inputArea.value = '';
                statsArea.style.display = 'none';
                emptyState.style.display = 'block';
                resultTable.style.display = 'none';
                resultBadge.textContent = '0 条';
                tableBody.innerHTML = '';
                showToast('🗑️ 已清空', 1000);
            });

            // 复制
            btnCopy.addEventListener('click', copyResult);

            // 键盘快捷键: Ctrl+Enter 触处理
            inputArea.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    btnProcess.click();
                }
            });

            // ============================================================
            //  初始化：自动填入示例并处理
            // ============================================================
            // 页面加载后自动填入示例并执行，让用户第一时间看到效果
            window.addEventListener('DOMContentLoaded', function() {
                inputArea.value = EXAMPLE_DATA.join('\n');
                // 延迟一小点执行，让渲染先完成
                setTimeout(() => {
                    btnProcess.click();
                }, 80);
            });

        })();
    </script>

</body>
</html>
